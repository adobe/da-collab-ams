name = "da-collab-ams"
main = "src/edge.js"
compatibility_date = "2023-10-30"

[dev]
port = 8789

# Secrets (set via: wrangler secret put SECRET_NAME --env ENVIRONMENT)
# Required per environment:
# - COLLAB_SHARED_SECRET  (protects /api/v1/syncadmin and /api/v1/deleteadmin)

# === GOV STAGE ===
[env.gov-stage]
account_id = "980b8b7745c7f2165f369b9d6f3c61f5"
keep_vars = true
routes = [{ pattern = "stg-collab.ssa-da.live/*", zone_name = "ssa-da.live" }]

services = [
  { binding = "daadmin", service = "da-admin-ams-gov-stage" }
]

[env.gov-stage.durable_objects]
bindings = [{ name = "rooms", class_name = "DocRoom" }]

[[env.gov-stage.migrations]]
tag = "v1"
new_classes = ["DocRoom"]

[env.gov-stage.vars]
ENVIRONMENT = "gov-stage"
DA_DOMAIN = "stg.ssa-da.live"
ADMIN_ORIGIN = "https://stg-admin.ssa-da.live"
VERSION = "@@VERSION@@"
CF_ACCOUNT_ID = "980b8b7745c7f2165f369b9d6f3c61f5"
RETURN_STACK_TRACES = "false"

# === GOV PROD ===
[env.gov-prod]
account_id = "REPLACE_WITH_GOV_PROD_ACCOUNT_ID"
keep_vars = true
routes = [{ pattern = "collab.ssa-da.live/*", zone_name = "ssa-da.live" }]

services = [
  { binding = "daadmin", service = "da-admin-ams-gov-prod" }
]

[env.gov-prod.durable_objects]
bindings = [{ name = "rooms", class_name = "DocRoom" }]

[[env.gov-prod.migrations]]
tag = "v1"
new_classes = ["DocRoom"]

[env.gov-prod.vars]
ENVIRONMENT = "gov-prod"
DA_DOMAIN = "ssa-da.live"
ADMIN_ORIGIN = "https://admin.ssa-da.live"
VERSION = "@@VERSION@@"
CF_ACCOUNT_ID = "REPLACE_WITH_GOV_PROD_ACCOUNT_ID"
RETURN_STACK_TRACES = "false"
